[package]
name = "pincerbell"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An independent Matrix Push Gateway implementation in Rust"
license = "MIT"
repository = "https://github.com/isnogudus/pincerbell"
keywords = ["matrix", "push", "notifications"]
categories = ["network-programming"]

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
futures = "0.3"
hkdf = "0.12"
jsonwebtoken = "9"
p256 = { version = "0.13", features = ["ecdh", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
