[package]
name = "pincerbell"
version = "0.1.0"
edition = "2024"
description = "An independent Matrix Push Gateway implementation in Rust"
license = "MIT"
repository = "https://github.com/isnogudus/pincerbell"
keywords = ["matrix", "push", "notifications"]
categories = ["network-programming"]

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
